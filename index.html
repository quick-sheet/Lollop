<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lollop</title>
<meta name="description" content="Hop a fox across roads, railways and canals, one tap at a time.">
<meta name="theme-color" content="#F3F0E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lollop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root {
  --bg: #0F1528; --raise: #161E37; --raise-2: #1D2645;
  --line: rgba(205, 214, 245, .09); --line-2: rgba(205, 214, 245, .17);
  --ink: #ECE8DF; --ink-2: #A3ABC2; --ink-3: #6E7794;
  --sun: #F5A25A; --sun-soft: rgba(245, 162, 90, .17); --on-sun: #1D1205;
  --dome-in: #0A0F21; --dome-out: #1A2448;
  --hud: #ECE8DF;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="day"] {
  --bg: #F3F0E8; --raise: #FFFFFF; --raise-2: #EEEAE0;
  --line: rgba(29, 34, 48, .08); --line-2: rgba(29, 34, 48, .16);
  --ink: #1D2230; --ink-2: #4E5566; --ink-3: #7F8696;
  --sun: #E8732C; --sun-soft: rgba(232, 115, 44, .14); --on-sun: #FFFFFF;
  --dome-in: #7FC6E8; --dome-out: #A2DA5E;
  --hud: #FFFFFF;
  color-scheme: light;
}
:root[data-theme="red"] {
  --bg: #0C0404; --raise: #160707; --raise-2: #1F0A0A;
  --line: rgba(255, 90, 70, .12); --line-2: rgba(255, 90, 70, .22);
  --ink: #E2573F; --ink-2: #A9412F; --ink-3: #74291F;
  --sun: #FF5B3D; --sun-soft: rgba(255, 91, 61, .18); --on-sun: #1A0503;
  --dome-in: #070202; --dome-out: #1E0808; --hud: #E2573F;
}
:root[data-theme="amber"] {
  --bg: #0D0904; --raise: #171008; --raise-2: #20170C;
  --line: rgba(255, 190, 110, .10); --line-2: rgba(255, 190, 110, .20);
  --ink: #EBC48A; --ink-2: #A98A5C; --ink-3: #6F5A3B;
  --sun: #FFB04A; --sun-soft: rgba(255, 176, 74, .18); --on-sun: #1A0F02;
  --dome-in: #080502; --dome-out: #241809; --hud: #EBC48A;
}
:root[data-theme="sea"] {
  --bg: #06121A; --raise: #0B1C26; --raise-2: #102632;
  --line: rgba(150, 220, 230, .09); --line-2: rgba(150, 220, 230, .18);
  --ink: #D6E9EC; --ink-2: #8EAEB4; --ink-3: #5A7880;
  --sun: #6FD9D0; --sun-soft: rgba(111, 217, 208, .16); --on-sun: #031513;
  --dome-in: #030B10; --dome-out: #0F2A38; --hud: #D6E9EC;
}
:root[data-theme="aurora"] {
  --bg: #07110D; --raise: #0C1A14; --raise-2: #11241B;
  --line: rgba(150, 235, 190, .09); --line-2: rgba(150, 235, 190, .18);
  --ink: #D7EBDF; --ink-2: #8DAA9A; --ink-3: #5A7566;
  --sun: #86E3A8; --sun-soft: rgba(134, 227, 168, .16); --on-sun: #04140B;
  --dome-in: #040A07; --dome-out: #12291E; --hud: #D7EBDF;
}
:root[data-theme="dusk"] {
  --bg: #110D1A; --raise: #1A1426; --raise-2: #221A31;
  --line: rgba(210, 190, 255, .09); --line-2: rgba(210, 190, 255, .18);
  --ink: #E8E1F4; --ink-2: #A79CBD; --ink-3: #6E6485;
  --sun: #F2A7C8; --sun-soft: rgba(242, 167, 200, .16); --on-sun: #1E0812;
  --dome-in: #0A0712; --dome-out: #261C3A; --hud: #E8E1F4;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* Glass surfaces that sit over the world */
.glass { background: var(--raise); box-shadow: 0 10px 30px rgba(0, 0, 0, .16), 0 0 0 1px var(--line); }
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .glass { background: color-mix(in srgb, var(--raise) 86%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
}

/* Title screen */
.ui { position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); transition: opacity .25s; }
.ui.off { opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s; }
.wrap { width: 100%; max-width: 34rem; margin: 0 auto; padding: 0 12px; position: relative; }
header.top { pointer-events: auto; display: grid; grid-template-columns: 1fr auto; align-items: center; margin-top: 10px; padding: 8px 4px 8px 16px; border-radius: 22px; }
.mark { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.where { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; gap: 2px; }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:active { background: var(--raise-2); }
.icon-btn svg { width: 22px; height: 22px; }
#notices { pointer-events: auto; }
.notice { display: flex; gap: 12px; align-items: center; margin: 8px 0 0; padding: 10px 10px 10px 16px; border-radius: 18px; font-size: 14px; color: var(--ink-2); }
.notice p { margin: 0; flex: 1; }
.notice .link-btn { color: var(--sun); font-weight: 600; white-space: nowrap; text-decoration: none; }
.notice .x { color: var(--ink-3); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.notice .x svg { width: 16px; height: 16px; }
.spacer { flex: 1; }
.panel { pointer-events: auto; margin-bottom: 12px; padding: 16px 18px 16px; border-radius: 24px; }
.panel .story { margin: 12px 0 0; font-size: 17px; font-weight: 300; line-height: 1.5; }
.panel .facts { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
.switcher { display: flex; padding: 3px; border-radius: 22px; background: var(--raise-2); }
.switcher button { flex: 1; height: 38px; border-radius: 19px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
.switcher button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
:root:not([data-theme="day"]) .switcher button[aria-pressed="true"] { background: var(--bg); }
.go { margin: 12px 0 0; font-size: 15px; font-weight: 600; color: var(--sun); display: flex; align-items: center; gap: 8px; }
.go .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.6); opacity: .45; } }

.tap-hint { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; padding: 6px 12px; border-radius: 16px; font-size: 14px; font-weight: 600;
  color: #fff; background: rgba(20, 24, 36, .55); white-space: nowrap; opacity: 0; transition: opacity .3s; }
.tap-hint.on { opacity: 1; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -5px; } }

/* Theme picker */
.pop { position: absolute; top: 66px; right: 12px; z-index: 5; width: min(300px, calc(100% - 24px)); padding: 16px 12px 12px; border-radius: 20px;
  background: var(--raise); box-shadow: 0 18px 40px rgba(0, 0, 0, .35), 0 0 0 1px var(--line-2); animation: drop .18s ease-out; transform-origin: top right; pointer-events: auto; }
.pop[hidden] { display: none; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.pop-title { margin: 0 4px 10px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 6px; }
.theme-opt { display: grid; justify-items: center; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); }
.theme-opt[aria-pressed="true"] { color: var(--ink); }
.sw { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2);
  background: radial-gradient(circle, var(--b) 0 6px, transparent 7px), linear-gradient(var(--c) 0 50%, var(--a) 50%); }
.theme-opt[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--raise), 0 0 0 4px var(--sun); }
.theme-note { margin: 12px 4px 0; font-size: 12.5px; color: var(--ink-3); }

/* In play */
.hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
  padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left)); color: var(--hud);
  text-shadow: 0 2px 0 rgba(0, 0, 0, .28), 0 0 18px rgba(0, 0, 0, .25); transition: opacity .2s; }
.hud::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: calc(120px + env(safe-area-inset-top)); z-index: -1;
  background: linear-gradient(rgba(10, 14, 26, .26), rgba(10, 14, 26, 0)); }
.hud[hidden] { display: flex; opacity: 0; visibility: hidden; }
.score { font-size: 52px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.best { display: block; font-size: 14px; font-weight: 500; margin-top: 2px; opacity: .92; letter-spacing: 0; }
.hud-right { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.chipcount { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 600; }
.chipcount svg { width: 22px; height: 22px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .3)); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(12, 16, 28, .32); text-shadow: none; }
:root:not([data-theme="day"]) .round { color: var(--hud); }
.round svg { width: 20px; height: 20px; }
.banner { position: fixed; left: 50%; top: calc(96px + env(safe-area-inset-top)); transform: translate(-50%, -6px); padding: 8px 18px; border-radius: 20px;
  font-size: 15px; font-weight: 600; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s; white-space: nowrap; }
.banner.on { opacity: 1; transform: translate(-50%, 0); }

/* Sheets */
dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 34rem; max-height: 88vh;
  border: 0; border-radius: 24px 24px 0 0; padding: 0; background: var(--raise); color: var(--ink); overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }
dialog.sheet[open] { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
dialog.sheet::backdrop { background: rgba(4, 6, 14, .45); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-in { padding: 10px 22px calc(26px + env(safe-area-inset-bottom)); }
.drag { touch-action: none; cursor: grab; }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.sheet h3 { margin: 24px 0 8px; font-size: 15px; font-weight: 600; }
.sheet p { margin: 6px 0; color: var(--ink-2); font-size: 15px; }
.sheet .small { font-size: 13.5px; color: var(--ink-3); }
.big-score { display: flex; align-items: center; gap: 12px; }
.big-score .n { font-size: 60px; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
.tag { height: 28px; padding: 0 12px; border-radius: 14px; background: var(--sun-soft); color: var(--sun); font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; }
.sheet .story { margin: 12px 0 0; font-size: 18px; font-weight: 300; line-height: 1.55; color: var(--ink); }
.sheet .facts { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 20px; }
.btn { height: 48px; padding: 0 22px; border-radius: 24px; background: var(--raise-2); font-weight: 600; font-size: 15.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn.wide { flex: 1; }
.btn.danger-armed { background: var(--sun-soft); color: var(--sun); }
.icon-btn.solid { width: 48px; height: 48px; background: var(--raise-2); color: var(--ink); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.toggle-row p { margin: 0; color: var(--ink); }
.toggle-row .small { display: block; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--raise-2); position: relative; flex: none; transition: background .2s; box-shadow: inset 0 0 0 1px var(--line-2); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-3); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: var(--sun); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-sun); }
.howto { list-style: none; margin: 0; padding: 0; }
.howto li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink-2); }
.howto li strong { color: var(--ink); font-weight: 600; }
.foot { margin-top: 22px; font-size: 12.5px; color: var(--ink-3); }

/* Toast: a popover, so it shows above open sheets */
.toast { position: fixed; inset: auto auto calc(24px + env(safe-area-inset-bottom)) 50%; margin: 0; border: 0; width: max-content; max-width: calc(100% - 40px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px;
  font-size: 14px; font-weight: 500; text-align: center; transition: opacity .2s, transform .2s; z-index: 10; overflow: visible; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* No WebGL */
.nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); text-align: center; }
.nogl[hidden] { display: none; }
.nogl h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
.nogl p { margin: 0 auto; max-width: 26em; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="The game. Tap to hop forward, swipe to step aside or back, hold and let go to lollop two rows."></canvas>

<div class="hud" id="hud" hidden>
  <div class="score num"><span id="score" aria-label="Rows">0</span><span class="best num" id="bestLine"></span></div>
  <div class="hud-right">
    <span class="chipcount num" id="chipCount" aria-label="Chips this run"></span>
    <button class="round" id="pauseBtn" type="button" aria-label="Pause" title="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
  </div>
</div>
<div class="banner glass" id="banner" aria-live="polite"></div>

<div class="ui" id="title">
  <div class="wrap">
    <header class="top glass">
      <div><div class="mark">Lollop</div><div class="where num" id="headLine"></div></div>
      <div class="tools">
        <button class="icon-btn" id="themeBtn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="themes" aria-label="Time of day" title="Time of day">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>
    <div class="pop" id="themes" hidden role="group" aria-label="Time of day"></div>
    <div id="notices"></div>
  </div>
  <div class="spacer"></div>
  <div class="wrap">
    <section class="panel glass" id="panel" aria-label="Start a run"></section>
  </div>
</div>
<div class="tap-hint" id="tapHint" aria-hidden="true">Tap to hop</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" popover="manual"></div>
<div class="nogl" id="nogl" hidden><div><h1>Lollop can’t draw here</h1><p>This browser has 3D graphics (WebGL 2) switched off or doesn’t support it. Try the latest Chrome or Safari, or turn hardware acceleration back on.</p></div></div>

<script src="core.js?v=1"></script>
<script src="gfx.js?v=1"></script>
<script>
(() => {
'use strict';
const C = window.Core, G = window.Gfx;

/* ---------- Platform and storage ---------- */
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const canVibrate = typeof navigator.vibrate === 'function' && !isIOS;
const PFX = 'llp.';
const get = (k, d) => { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

const THEMES = [
  { id: 'day', name: 'Daylight', a: '#A2DA5E', c: '#7FC6E8', b: '#E8732C', bar: '#F3F0E8' },
  { id: 'twilight', name: 'Twilight', a: '#2C3150', c: '#0F1528', b: '#F5A25A', bar: '#0F1528' },
  { id: 'red', name: 'Night red', a: '#1E0808', c: '#0C0404', b: '#FF5B3D', bar: '#0C0404' },
  { id: 'amber', name: 'Amber', a: '#241809', c: '#0D0904', b: '#FFB04A', bar: '#0D0904' },
  { id: 'sea', name: 'Deep sea', a: '#0F2A38', c: '#06121A', b: '#6FD9D0', bar: '#06121A' },
  { id: 'aurora', name: 'Aurora', a: '#12291E', c: '#07110D', b: '#86E3A8', bar: '#07110D' },
  { id: 'dusk', name: 'Dusk', a: '#261C3A', c: '#110D1A', b: '#F2A7C8', bar: '#110D1A' },
];

const S = {
  set: Object.assign({ theme: 'day', sound: true, vibe: true, mode: 'endless' }, get('settings', {})),
  best: get('best', 0),
  daily: get('daily', { key: '', best: 0 }),
  chips: get('chips', 0),
  runs: get('runs', 0),
  state: 'ready', now: 0, t: 0,
  W: null, fox: null, hop: null, boat: null, queue: null,
  maxR: 0, lol: { ready: true, rows: 0 }, runChips: 0, taken: new Set(),
  cam: { x: 0, z: 0 }, gull: null, gullWarn: false, parts: [], shake: null, death: null,
  press: null, hist: false, ignorePop: 0, sheet: null, installEvt: null, bells: new Map(), banner: 0,
};
const saveSet = () => put('settings', S.set);

/* ---------- Sound: tiny synthesised effects, no files ---------- */
const Snd = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function wake() {
    if (!S.set.sound) return null;
    try {
      if (!ctx) {

/* ---------- Words ---------- */
const VEHICLE_WORDS = { car: 'a car', cab: 'a black cab', bus: 'a double-decker', van: 'a van', tractor: 'a tractor', lorry: 'a hay lorry', hover: 'a hover car', pod: 'a pod racer', hoverbus: 'a hover bus' };

/* ---------- Moves ---------- */

function land() {
  const H = S.hop, F = S.fox;

  const res = C.land(S.W, x, H.tr, S.t);

/* ---------- Particles and shake ---------- */
const hexCol = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

    S.parts.push({ x, y, z, vx: Math.cos(a) * s * 0.6, vy: (water ? 3.4 : 2.4) + Math.random() * 2.4, vz: Math.sin(a) * s * 0.6,

function stepFoxShape(dt) {
  const F = S.fox;

  else slowFor = 0;

function draw() {

  const sh = S.shake ? [(Math.random() - 0.5) * S.shake.a * (S.shake.t / S.shake.d) * 2, (Math.random() - 0.5) * S.shake.a * (S.shake.t / S.shake.d) * 2] : null;

  }

  let ring = null;
  if (showRing) {
    const charged = S.press && !S.press.used && performance.now() / 1000 - S.press.t0 > HOLD && S.lol.ready;
    ring = { p: S.lol.ready ? 1 : S.lol.rows / C.LOLLOP_EVERY, full: S.lol.ready, hot: charged };
  }
  G.render({
    W: S.W, t: S.t, now: S.now, cam: S.cam, shake: sh,
    fox: { x: F.vx, y: F.vy, z: F.vz, k: F.k, sx: F.sx, sy: F.sy, sz: F.sz, hidden: F.hidden, leg: F.leg, tail: F.tail, ringY: S.hop ? Math.min(S.hop.y0, S.hop.y1) : F.vy },
    ring, gull, parts: S.parts, taken: S.taken,
  });
  // the "tap to hop" hint floats above the fox before the first hop
  const hint = $('#tapHint');
  const showHint = S.state === 'ready' && S.runs < 3 && !$('#sheet').open;
  if (showHint) {
    const p = G.project(F.vx, F.vy + 1.25, F.vz);
    if (p) { hint.style.left = `${p.x * innerWidth}px`; hint.style.top = `${p.y * innerHeight}px`; }
  }
  hint.classList.toggle('on', showHint);
}

/* ---------- Input: tap to hop, swipe to step, hold and let go to lollop ---------- */
const HOLD = 0.3, SWIPE = 22;
const cvs = $('#world');
cvs.addEventListener('pointerdown', (e) => {
  if (popOpen()) { closePops(); return; }
  if (!(S.state === 'play' || S.state === 'ready')) return;
  if (S.press) return;
  Snd.wake();
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  // event times, not frame times, so a busy frame never turns a quick tap into a hold
  S.press = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: (e.timeStamp || performance.now()) / 1000, used: false };
});
cvs.addEventListener('pointermove', (e) => {
  const p = S.press;
  if (!p || p.id !== e.pointerId || p.used) return;
  const dx = e.clientX - p.x0, dy = e.clientY - p.y0;
  if (Math.hypot(dx, dy) < SWIPE) return;
  p.used = true;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
});
function release(e) {
  const p = S.press;
  if (!p || p.id !== e.pointerId) return;
  S.press = null;
  if (p.used || e.type === 'pointercancel') return;
  const held = (e.timeStamp || performance.now()) / 1000 - p.t0;
  move(held > HOLD && S.lol.ready ? 'lollop' : 'up');
}
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('contextmenu', (e) => e.preventDefault());

const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyL: 'lollop' };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (popOpen()) { closePops(); $('#themeBtn').focus(); } return; }
  if ($('#sheet').open || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.code === 'KeyP') && S.state === 'play') { pause(); return; }
  let dir = KEYS[e.code];
  if (e.code === 'Space') dir = 'up';
  if (dir === 'up' && e.shiftKey) dir = 'lollop';
  if (!dir || !(S.state === 'play' || S.state === 'ready')) return;
  // Space on a focused button presses the button, not the fox
  if (e.code === 'Space' && document.activeElement && document.activeElement.closest('button')) return;
  e.preventDefault();
  Snd.wake();
  move(dir);
});

/* ---------- Screens ---------- */
function updateHud() {
  $('#score').textContent = S.maxR;
  const b = Math.max(bestNow(), S.state === 'play' ? 0 : 0);
  $('#bestLine').textContent = isToday() ? `Best ${b} today` : `Best ${b}`;
  $('#chipCount').innerHTML = `${CHIP_SVG}<span>${S.runChips}</span>`;
}
const CHIP_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="2.4" height="11" rx="1" fill="#F7C948"/><rect x="10.8" y="2" width="2.4" height="12" rx="1" fill="#FFD866"/><rect x="14.6" y="3.5" width="2.4" height="10.5" rx="1" fill="#F7C948"/><path d="M4.5 10h15l-1.8 10.2a1.5 1.5 0 0 1-1.5 1.3H7.8a1.5 1.5 0 0 1-1.5-1.3Z" fill="#E53935"/><path d="M5.2 13.5h13.6" stroke="#fff" stroke-width="1.4"/></svg>';

function showBanner(text) {
  const b = $('#banner');
  b.textContent = text;
  b.classList.add('on');
  Snd.zone();
  clearTimeout(S.banner);
  S.banner = setTimeout(() => b.classList.remove('on'), 2200);
}

function renderTitle() {
  const today = isToday();
  const b = bestNow();
  $('#headLine').textContent = `${today ? 'Today’s route' : 'Endless'} · best ${b}`;
  const story = today
    ? `Today’s route is the same on every phone until midnight. Tap to hop, swipe to step aside or back.`
    : `Tap to hop. Swipe to step aside or back. Hold, then let go, to lollop two rows at once.`;
  const chips = S.chips === 1 ? '1 chip collected' : `${S.chips} chips collected`;
  $('#panel').innerHTML = `<div class="switcher" role="group" aria-label="Which run">
      <button type="button" data-mode="endless" aria-pressed="${!today}">Endless</button>
      <button type="button" data-mode="today" aria-pressed="${today}">Today’s route</button></div>
    <p class="story">${esc(story)}</p>
    <p class="facts num">${esc(today ? todayLong() + ' · ' + chips : chips)}</p>
    <p class="go"><span class="dot"></span>Tap the world to start</p>`;
  renderNotices();
}

function renderNotices() {
  const out = [], dismissed = get('dismissed', {});
  if (!standalone && !dismissed.install) {
    const x = `<button class="x" type="button" data-dismiss="install" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
    if (S.installEvt) out.push(`<div class="notice glass"><p>Add Lollop to your home screen for one-tap access.</p><button class="link-btn" type="button" data-act="install">Install</button>${x}</div>`);
    else if (isIOS) out.push(`<div class="notice glass"><p>Add Lollop to your Home Screen: tap Share, then Add to Home Screen.</p>${x}</div>`);
  }
  $('#notices').innerHTML = out.join('');
}

/* ---------- Sheets ---------- */
const sheet = $('#sheet');
function openSheet(kind, html) {
  S.sheet = kind;
  $('#sheetBody').innerHTML = html;
  sheet.style.transform = '';
  if (!sheet.open) sheet.showModal();
}
function closeSheet() { if (sheet.open) sheet.close(); }
sheet.addEventListener('close', () => {
  const k = S.sheet;
  S.sheet = null;
  if (k === 'pause' && S.state === 'paused') quitRun();
  else if (k === 'over' && S.state === 'over') newRun();
});
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
// Drag the top of a sheet down to close it
(function dragToClose() {
  let d = null;
  sheet.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.drag') || e.target.closest('button')) return;
    d = { id: e.pointerId, y0: e.clientY, t0: performance.now(), dy: 0 };
    try { sheet.setPointerCapture(e.pointerId); } catch {}
  });
  sheet.addEventListener('pointermove', (e) => {
    if (!d || d.id !== e.pointerId) return;
    d.dy = Math.max(0, e.clientY - d.y0);
    if (!reduceMotion.matches) sheet.style.transform = `translateY(${d.dy}px)`;
  });
  const end = (e) => {
    if (!d || d.id !== e.pointerId) return;
    const v = d.dy / Math.max(1, performance.now() - d.t0);
    const go = d.dy > sheet.offsetHeight / 4 || v > 0.5;
    d = null;
    if (go) closeSheet(); else sheet.style.transform = '';
  };
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
})();

function openSettings() {
  closePops();
  openSheet('settings', `<div class="drag"><div class="grabber"></div>
    <div class="sheet-head"><h2 id="sheetTitle">Settings</h2>
    <button class="icon-btn" type="button" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
    <div class="toggle-row"><p>Sound</p><button class="switch" type="button" role="switch" data-act="sound" aria-checked="${S.set.sound}" aria-label="Sound"></button></div>
    ${canVibrate ? `<div class="toggle-row"><p>Vibration<span class="small">A short buzz when you lollop or get caught</span></p><button class="switch" type="button" role="switch" data-act="vibe" aria-checked="${S.set.vibe}" aria-label="Vibration"></button></div>` : ''}
    <h3>How to play</h3>
    <ul class="howto">
      <li><strong>Tap</strong>Hop forward a row.</li>
      <li><strong>Swipe</strong>Step left, right or back.</li>
      <li><strong>Hold, let go</strong>Lollop two rows at once, clean over a lane of traffic. The ring under the fox fills again after 15 new rows.</li>
      <li><strong>Seagull</strong>Dawdle or head backwards and it swoops. It squawks first.</li>
      <li><strong>Chips</strong>Hop onto them to collect them. They’re saved on this phone.</li>
      <li><strong>Keys</strong>Arrows or WASD to move, Shift and up, or L, to lollop, P to pause.</li>
    </ul>
    <h3>Scores</h3>
    <p class="num">Best ${S.best} in Endless. ${S.daily.key === C.dateKey(new Date()) ? `Best ${S.daily.best} on today’s route.` : 'No run on today’s route yet.'} ${S.chips} chips collected.</p>
    <div class="actions"><button class="btn" type="button" data-act="reset">Reset scores</button></div>
    <p class="foot">Release 1. Works offline once opened. Scores stay on this phone.</p>`);
}

/* ---------- Theme ---------- */
function themeGridHtml() {
  return `<h2 class="pop-title">Time of day</h2><div class="theme-grid">${THEMES.map((t) => `<button class="theme-opt" type="button" data-theme="${t.id}" aria-pressed="${S.set.theme === t.id}">
      <span class="sw" style="--a:${t.a};--c:${t.c};--b:${t.b}"></span>${t.name}</button>`).join('')}</div>
    <p class="theme-note">Each one sets the time of day in the world. Night red and Amber are gentlest on eyes adjusted to the dark.</p>`;
}
function setTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  S.set.theme = t.id; saveSet();
  document.documentElement.dataset.theme = t.id;
  $('meta[name=theme-color]').setAttribute('content', t.bar);
  G.setTheme(t.id);
  document.querySelectorAll('.theme-opt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === t.id)));
}
const POPS = { themes: '#themeBtn' };
function togglePop(id, open) {
  const pop = $('#' + id);
  const show = open == null ? pop.hidden : open;
  if (show) pop.innerHTML = themeGridHtml();
  pop.hidden = !show;
  $(POPS[id]).setAttribute('aria-expanded', String(show));
}
function closePops() { for (const id in POPS) if (!$('#' + id).hidden) togglePop(id, false); }
const popOpen = () => Object.keys(POPS).some((id) => !$('#' + id).hidden);
// With the panel open, a tap anywhere outside it only closes the panel
document.addEventListener('click', (e) => {
  if (!popOpen() || e.target.closest('.pop, ' + Object.values(POPS).join(', '))) return;
  e.preventDefault(); e.stopPropagation(); closePops();
}, true);

/* ---------- Share ---------- */
async function share() {
  const url = location.origin + location.pathname + (isToday() ? '#today' : '');
  const n = S.maxR;
  const text = isToday()
    ? `I reached ${n} on today’s Lollop route (${todayLong()}). Can you beat it?`
    : `I lolloped ${n} rows in Lollop. Can you beat it?`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Lollop', text, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Copied your score. Paste it anywhere to share.'); }
  catch { toast('Couldn’t copy your score on this browser.'); }
}

/* ---------- Taps on buttons ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.theme) { setTheme(d.theme); return; }
  if (d.mode) {
    if (S.set.mode === d.mode) return;
    S.set.mode = d.mode; saveSet();
    newRun();
    return;
  }
  if (d.dismiss) { const x = get('dismissed', {}); x[d.dismiss] = 1; put('dismissed', x); renderNotices(); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'again': newRun(); closeSheet(); break;
    case 'share': share(); break;
    case 'resume': resume(); break;
    case 'restart': S.state = 'over'; dropHistory(); newRun(); closeSheet(); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; renderNotices(); } break;
    case 'sound':
      S.set.sound = !S.set.sound; saveSet(); t.setAttribute('aria-checked', String(S.set.sound));
      if (S.set.sound) Snd.chip();
      break;
    case 'vibe':
      S.set.vibe = !S.set.vibe; saveSet(); t.setAttribute('aria-checked', String(S.set.vibe));
      if (S.set.vibe) buzz(20);
      break;
    case 'reset':
      if (!t.classList.contains('danger-armed')) { t.classList.add('danger-armed'); t.textContent = 'Tap again to reset'; return; }
      S.best = 0; S.daily = { key: '', best: 0 }; S.chips = 0;
      put('best', 0); put('daily', S.daily); put('chips', 0);
      closeSheet(); renderTitle(); updateHud();
      toast('Scores and chips reset');
      break;
  }
});
$('#themeBtn').addEventListener('click', () => togglePop('themes'));
$('#settingsBtn').addEventListener('click', openSettings);
$('#pauseBtn').addEventListener('click', pause);

/* ---------- Back, leaving and returning ---------- */
window.addEventListener('popstate', () => {
  if (S.ignorePop > 0) { S.ignorePop--; return; }
  if (S.state === 'play' || S.state === 'dying') { S.hist = false; if (S.state === 'play') pause(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && S.state === 'play') pause();
  if (document.visibilityState === 'visible') last = 0;
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; renderNotices(); });

function size() {
  G.resize(innerWidth, innerHeight, dpr);
}
window.addEventListener('resize', size);

/* ---------- Start ---------- */
(function start() {
  if (location.hash === '#today') { S.set.mode = 'today'; saveSet(); history.replaceState(null, '', location.pathname + location.search); }
  if (!G.init(cvs)) { $('#nogl').hidden = false; $('#title').hidden = true; return; }
  cvs.addEventListener('webglcontextlost', (e) => { e.preventDefault(); location.reload(); });
  setTheme(S.set.theme);
  size();
  newRun();
  requestAnimationFrame(frame);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
// for tests and curious minds
window.__lollop = S;
})();
</script>
</body>
</html>
